<style>
:root{--bg:#f4f4f9;--card:#fff;--ink:#2b2f36;--mut:#5f6b7a;--line:#e3e6ec;--brand:#3498db;--teal:#0f6e5f;--gold:#cfa54a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13161c;--card:#1c212b;--ink:#e6e9ef;--mut:#a3aebd;--line:#2c3340}}
:root[data-theme="dark"]{--bg:#13161c;--card:#1c212b;--ink:#e6e9ef;--mut:#a3aebd;--line:#2c3340}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif}
.g{--c:#1f9d6b}.b{--c:#d64545}.m{--c:#c98a1b}
header{background:var(--brand);color:#fff;padding:16px 14px;text-align:center}
header h1{margin:0;font-size:19px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.ctl select,.ctl input,.ctl button{font:inherit;font-size:13px;padding:8px 10px;border-radius:10px;border:1px solid #ffffff66;background:#ffffff26;color:#fff;min-width:110px}
.ctl select option{color:#222}
.ctl button{cursor:pointer;min-width:0}
.ctl button[hidden],.ioshint[hidden]{display:none}
.ioshint{display:flex;gap:10px;align-items:center;justify-content:center;margin:12px auto 0;max-width:560px;background:#ffffff26;border:1px solid #ffffff66;border-radius:12px;padding:8px 12px;font-size:13px;line-height:1.9}
.ioshint button{font:inherit;font-size:20px;background:none;border:0;color:#fff;cursor:pointer;line-height:1}
footer{text-align:center;color:var(--mut);font-size:12.5px;line-height:2;padding:14px 12px calc(22px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-top:8px}main{max-width:820px;margin:0 auto;padding:16px 12px 28px}

/* کارت تاریخ */
.dates{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px}
.dates .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.dates .dt small{display:block;font-size:12px;color:var(--mut)}
.dates .dt b{font-size:16.5px;line-height:1.7}
.dates .lunar{margin-top:12px;padding:10px 12px;border-radius:12px;border-right:6px solid var(--c);background:color-mix(in srgb,var(--c) 11%,var(--card));font-size:15px;line-height:2}
.dates .lunar strong{font-size:17px}
.dates .src{font-size:11.5px;color:var(--mut)}
.occ{margin-top:12px;padding:10px 12px;border-radius:12px;border-right:6px solid var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--card));font-size:16px;line-height:2}
.occ strong{font-size:17px}
.occ ul,.mev ul{margin:4px 0 0;padding:0 18px 0 0;list-style:none}
.occ li.x,.mev li.x{text-decoration:line-through;opacity:.7}
.occ small,.mev small{font-size:12px;text-decoration:none;display:inline-block}
.mev{margin-top:10px;font-size:14.5px;line-height:2}
.mev summary{cursor:pointer;font-weight:700;font-size:15px}
.mev li{padding:2px 6px;border-radius:8px}
.mev li[data-t]{background:color-mix(in srgb,var(--gold) 22%,var(--card))}
.mev li b{display:inline-block;min-width:26px;color:var(--teal)}

/* هشدار نحس / ممزوج */
.alert{border:2px solid var(--c);background:color-mix(in srgb,var(--c) 12%,var(--card));border-radius:16px;padding:18px;margin-bottom:16px}
.alert h2{margin:0 0 8px;font-size:23px;color:var(--c)}
.alert p{margin:6px 0;font-size:16px;line-height:2}
.alert ul{margin:8px 0;padding:0 22px 0 0;font-size:16px;line-height:2.1}
.pray{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 12px;margin-top:12px;text-align:center}
.pray .ph{font-size:13.5px;color:var(--mut);line-height:1.9;margin-bottom:8px}
.pray .tx{font-size:21px;line-height:2.4}
.pray mark{background:#ffe08a;color:#3b2a00;border-radius:6px;padding:0 6px}

/* اکنون */
.now{background:linear-gradient(160deg,#0f6e5f,#0a4a3e);border:1px solid var(--gold);border-radius:16px;color:#fbf3dd;padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.now .t{flex:1;min-width:200px}
.now h2{margin:0 0 6px;font-size:28px;color:#f1d38a}
.now .tg{display:inline-block;background:#fbf3dd22;border:1px solid #f1d38a88;border-radius:999px;padding:1px 12px;font-size:14px;margin-bottom:6px}
.now p{margin:5px 0;font-size:16px;line-height:2}
.now small{opacity:.85;font-size:13px}
.figs{display:flex;gap:12px}
.fig{text-align:center;font-size:11px}
.fig svg{display:block;margin:0 auto 2px}

/* خلاصه ساعات */
.sumbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px}
.sumbox h3{margin:0 0 4px;font-size:16px}
.sumbox .cnt{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-bottom:8px}
.sumbox .cnt span{display:inline-flex;align-items:center;gap:5px}
.sumbox .cnt i{width:11px;height:11px;border-radius:50%;background:var(--c);display:inline-block}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-bottom:14px}
.chips:last-child{margin-bottom:0}
.chip{font:inherit;cursor:pointer;color:var(--ink);text-align:center;padding:7px 4px;border-radius:12px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card));line-height:1.55;position:relative}
.chip small{position:absolute;top:3px;right:6px;font-size:10px;color:var(--mut)}
.chip b{display:block;font-size:15px}
.chip span{display:block;font-size:12px;direction:ltr;font-variant-numeric:tabular-nums}
.chip em{display:block;font-style:normal;font-size:11px;color:var(--c);font-weight:700}
.chip.cur{outline:3px solid var(--teal);outline-offset:1px}

/* ردیف‌ها */
.sun{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;font-size:14.5px;font-weight:700;margin:18px 4px 8px}
.sun span:last-child{color:var(--mut);font-weight:400;font-size:13px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;margin-bottom:8px;border:1px solid var(--line);border-right:7px solid var(--c);background:color-mix(in srgb,var(--c) 9%,var(--card));scroll-margin-top:90px}
.row.cur{outline:3px solid var(--teal);outline-offset:1px}
.row .tm{min-width:132px;font-size:14px;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.row .tm i{font-style:normal;color:var(--mut);font-size:11.5px}
.row .pl{flex:1}
.row .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .hd b{font-size:19px}
.tag{font-size:12.5px;font-weight:700;color:#fff;background:var(--c);border-radius:999px;padding:1px 10px}
.row .ds{font-size:15px;line-height:1.95;margin-top:2px}
.row .nt{font-size:13.5px;color:var(--mut);line-height:1.9}
.row .figs{gap:6px}
.row .fig{font-size:10px}
.msg{padding:24px;text-align:center;color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin-top:16px;line-height:2}
svg circle{fill:var(--gold)}
.row svg circle{fill:var(--teal)}
@media (max-width:520px){.row{flex-wrap:wrap}.row .tm{min-width:100%}}
</style>
</head>

<script id="core">
const D=Math.PI/180;
function sunEvents(y,m,d,lat,lon){
 const jd=Date.UTC(y,m,d,12)/864e5+2440587.5,T=(jd-2451545)/36525;
 const L0=(280.46646+T*(36000.76983+T*0.0003032))%360,M=357.52911+T*(35999.05029-0.0001537*T),e=0.016708634-T*(0.000042037+1.267e-7*T),Mr=M*D;
 const C=Math.sin(Mr)*(1.914602-T*(0.004817+0.000014*T))+Math.sin(2*Mr)*(0.019993-0.000101*T)+Math.sin(3*Mr)*0.000289;
 const om=125.04-1934.136*T,lam=L0+C-0.00569-0.00478*Math.sin(om*D);
 const eps=23+(26+(21.448-T*(46.815+T*(0.00059-T*0.001813)))/60)/60+0.00256*Math.cos(om*D);
 const dec=Math.asin(Math.sin(eps*D)*Math.sin(lam*D)),y2=Math.tan(eps*D/2)**2,L=L0*D;
 const eq=4*(y2*Math.sin(2*L)-2*e*Math.sin(Mr)+4*e*y2*Math.sin(Mr)*Math.cos(2*L)-0.5*y2*y2*Math.sin(4*L)-1.25*e*e*Math.sin(2*Mr))/D;
 const ch=(Math.cos(90.833*D)-Math.sin(lat*D)*Math.sin(dec))/(Math.cos(lat*D)*Math.cos(dec));
 if(Math.abs(ch)>1)return null;
 const H=Math.acos(ch)/D,noon=720-4*lon-eq,b=Date.UTC(y,m,d);
 return [b+(noon-4*H)*6e4,b+(noon+4*H)*6e4];
}

'آلمان':[['برلین',52.52,13.405,'Europe/Berlin'],['مونیخ',48.1351,11.582,'Europe/Berlin'],['هامبورگ',53.5511,9.9937,'Europe/Berlin'],['فرانکفورت',50.1109,8.6821,'Europe/Berlin']],

'هند':[['دهلی نو',28.6139,77.209,'Asia/Kolkata'],['مومبای',19.076,72.8777,'Asia/Kolkata'],['کلکته',22.5726,88.3639,'Asia/Kolkata'],['بنگلور',12.9716,77.5946,'Asia/Kolkata']],
'روسیه':[['مسکو',55.7558,37.6173,'Europe/Moscow'],['سن‌پترزبورگ',59.9343,30.3351,'Europe/Moscow'],['یکاترینبورگ',56.8389,60.6057,'Asia/Yekaterinburg'],['نووسیبیرسک',55.0084,82.9357,'Asia/Novosibirsk'],['ولادی‌وستوک',43.1155,131.8855,'Asia/Vladivostok']]};
function compute(ref,lat,lon){
 const R=[],S=[];
 for(let o=-2;o<=2;o++){const t=new Date(ref+o*864e5),ev=sunEvents(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate(),lat,lon);if(!ev)return null;R.push(ev[0]);S.push(ev[1]);}
 R.sort((a,b)=>a-b);S.sort((a,b)=>a-b);
 const r0=R.filter(x=>x<=ref).pop(),r1=R.find(x=>x>ref),s=S.find(x=>x>r0);
 return {r0,r1,s};
}

['g','مختار و خوب برای هر نیازی جز نویسندگی (برای کاتب مکروه است). بیمار زود شفا می‌یابد، مسافر مال زیادی به دست می‌آورد و فراری برمی‌گردد. اگر ضرورتی ندارد، در پی کار تازه نباشید.'],
['g','مختار و خوب برای هر چیز و هر نیازی از خرید و فروش، کشاورزی و ازدواج؛ بیمار زود شفا می‌یابد و مولود آن بردبار، مبارک، راستگو و باوفا خواهد بود.']];
const PR=['لا حول ولا قوة إلا بالله افرج بها كل كربة ،','لا حول ولا قوة إلا بالله أحل بها كل عقدة.','لا حول ولا قوة إلا بالله أجلو بها كل ظلمة.','لا حول ولا قوة إلا بالله أفتح بها كل باب.','لا حول ولا قوة إلا بالله أستعين بها على كل شدة ومصيبة.','لا حول ولا قوة إلا بالله أستعين بها على كل أمر ينزل بي.','لا حول ولا قوة إلا بالله أعتصم بها من كل محذور أحاذره.','لا حول ولا قوة إلا بالله أستوجب بها العفو والعافية والرضا من الله.','لا حول ولا قوة إلا بالله تفرق أعداء الله وغلبت حجة الله وبقي وجه الله.','لا حول ولا قوة إلا بالله ،','اللهم رب الارواح الفانية ورب الاجساد البالية ورب الشعور المتمعطة','ورب الجلود الممزقة ورب العظام النخرة ورب الساعة القائمة أسألك','يا رب أن تصلي على محمد وأهل بيته الطاهرين','وافعل بي كذا بخفي لطفك يا ذا الجلال والاكرام آمين آمين يا رب العالمين.'];
</script>
<script id="events">
const MN=['محرم','صفر','ربیع الاول','ربیع الثانی','جمادی الاول','جمادی الثانی','رجب','شعبان','رمضان','شوال','ذی القعده','ذی حجه'];
/* مناسبت‌های ماه‌های قمری — [روز، متن، (اختیاری) x = خط‌خورده] */
const EV=[
[[1,'آغاز سال قمری'],[9,'تاسوعای حسینی (ع)'],[10,'عاشورای حسینی (ع)'],[12,'شهادت امام زین العابدین (ع) (سال ۹۵ قمری)'],[18,'تغییر قبله از بیت المقدس به مکه (سال ۲ قمری)'],[25,'شهادت امام زین العابدین (ع) به روایتی (سال ۹۵ قمری)']],
[[20,'اربعین حسینی (ع)'],[28,'رحلت پیامبر (ص) (سال ۱۱ قمری)، شهادت امام حسن مجتبی (ع) (سال ۵۰ قمری)'],[29,'شهادت امام رضا (ع) (سال ۲۰۳ قمری)']],
[[1,'هجرت پیامبر (ص) از مکه به مدینه (مبدا تاریخ هجری قمری)'],[8,'شهادت امام حسن عسگری (ع) (سال ۲۶۹ قمری)'],[12,'ولادت پیامبر (ص) به روایت اهل سنت (سال ۵۳ پیش از هجرت)'],[17,'ولادت پیامبر (ص) به روایت شیعه (سال ۵۳ پیش از هجرت)، ولادت امام صادق (ع) (سال ۸۳ قمری)']],
[[8,'ولادت امام حسن عسگری (ع) (سال ۲۳۲ قمری)'],[10,'وفات حضرت معصومه (س) (سال ۲۰۱ قمری)']],
[[5,'ولادت حضرت زینب (س) (سال ۵ قمری)'],[13,'شهادت حضرت فاطمه (س) به روایتی (سال ۱۱ هجری)']],
[[3,'شهادت حضرت فاطمه (س) به روایتی (سال ۱۱ هجری)'],[20,'ولادت حضرت فاطمه (س) و روز زن (سال ۸ قبل از هجرت)']],
[[1,'ولادت امام باقر (ع) (سال ۵۷ قمری)'],[3,'شهادت امام هادی (ع) (سال ۲۵۴ قمری)'],[10,'ولادت امام جواد (ع) (سال ۱۹۵ قمری)'],[13,'ولادت امام علی (ع) (سال ۲۳ قبل از هجرت)','x'],[15,'وفات حضرت زینب (س) (سال ۶۲ قمری)'],[25,'شهادت امام موسی کاظم (ع) (سال ۱۸۳ قمری)'],[27,'مبعث پیامبر (ص) (سال ۱۳ قبل از هجرت)']],
[[3,'ولادت امام حسین (ع) (سال ۴ قمری)، روز پاسدار'],[4,'ولادت حضرت ابوالفضل (ع) (سال ۲۶ قمری)، روز جانباز'],[5,'ولادت امام زین العابدین (ع) (سال ۳۸ قمری)'],[7,'ولادت امام علی (ع) بر اساس روایات'],[11,'ولادت حضرت علی اکبر (ع) (سال ۳۳ قمری)'],[15,'ولادت حضرت مهدی (عج) (سال ۲۵۵ قمری)']],
[[10,'وفات حضرت خدیجه (س) (سال ۳ قبل از هجرت)'],[15,'ولادت امام حسن (ع) (سال ۳ قمری)'],[18,'شب قدر اول'],[19,'ضربت خوردن امام علی (ع) (سال ۴۰ قمری)'],[20,'شب قدر دوم'],[21,'شهادت امام علی (ع) (سال ۴۰ قمری)'],[22,'شب قدر سوم']],
[[1,'عید فطر'],[21,'فتح اندلس به دست مسلمانان'],[25,'شهادت امام صادق (ع) (سال ۱۴۸ قمری)']],
[[1,'ولادت حضرت معصومه (س) (سال ۱۷۳ قمری)'],[11,'ولادت امام رضا (ع) (سال ۱۴۸ قمری)'],[29,'شهادت امام جواد (ع) (سال ۲۲۰ قمری)']],
[[7,'شهادت امام باقر (ع) (سال ۱۱۴ قمری)'],[10,'عید قربان'],[15,'ولادت امام هادی (ع) (سال ۲۱۲ قمری)'],[18,'عید غدیر (سال ۱۰ قمری)']]];

<script>
const $=id=>document.getElementById(id),co=$('co'),ci=$('ci'),dt=$('dt'),lu=$('lu'),out=$('out');
const fa=n=>n.toLocaleString('fa-IR');
let mevOpen=false;
out.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('mev'))mevOpen=e.target.open},true);
let adj=0;try{adj=+localStorage.getItem('adj')||0}catch(e){}
lu.value=String(adj);
Object.keys(CT).forEach(k=>co.add(new Option(k,k)));
function fillCities(){ci.innerHTML='';CT[co.value].forEach((c,i)=>ci.add(new Option(c[0],i)));}
fillCities();
const fig=(c,n)=>{let s='<div class="fig"><svg width="28" height="36" viewBox="0 0 28 36">';
 [...c].forEach((v,i)=>{s+=v==='1'?`<circle cx="14" cy="${5+i*9}" r="3.2"/>`:`<circle cx="8" cy="${5+i*9}" r="3.2"/><circle cx="20" cy="${5+i*9}" r="3.2"/>`});
 return s+`</svg>${n}</div>`};
const figs=p=>'<div class="figs">'+FIG[p].map(f=>fig(f[1],f[0])).join('')+'</div>';
const prayerBox=()=>`<div class="pray"><div class="ph">این دعا را در زمان ناچاری و اضطرار بخوانید. به جای «کذا» حاجت خود را برای رفع نحسی روز بیان کنید.</div><div class="tx" dir="rtl" lang="ar">${PR.join('<br>').replace('كذا','<mark>كذا</mark>')}</div></div>`;
const advice=`<ul><li>هنگام بیرون رفتن از خانه صدقه بدهید.</li><li>آیت‌الکرسی و سوره‌های ناس و فلق را بخوانید.</li><li>اگر ناچار به انجام کاری هستید، دعای پایین را بخوانید.</li></ul>`;
function render(scroll){
 const c=CT[co.value][ci.value],tz=c[3],lat=c[1],lon=c[2];
 const tf=new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZone:tz});
 const wf=new Intl.DateTimeFormat('fa',{weekday:'long',timeZone:tz}),kf=new Intl.DateTimeFormat('en-CA',{timeZone:tz});
 const wk=new Intl.DateTimeFormat('en-US',{weekday:'short',timeZone:tz});
 const fm=(loc,o,t)=>{const p=new Intl.DateTimeFormat(loc,{...o,timeZone:tz}).formatToParts(t),g=k=>(p.find(x=>x.type===k)||{}).value||'';return (g('weekday')?g('weekday')+'، ':'')+g('day')+' '+g('month')+' '+g('year');};
 let ref=Date.now();
 if(dt.value){const[y,m,d]=dt.value.split('-').map(Number);ref=Date.UTC(y,m-1,d,12)-lon/15*36e5;}
 const r=compute(ref,lat,lon);
 if(!r){out.innerHTML='<div class="msg">در این تاریخ و مکان طلوع و غروب مشخصی وجود ندارد.</div>';return;}

 /* تاریخ‌ها و حکم روز قمری (روز از طلوع آغاز می‌شود) */
 const lt=r.r0+adj*864e5;
 const lp=new Intl.DateTimeFormat('en-US-u-ca-islamic-umalqura',{day:'numeric',month:'numeric',timeZone:tz}).formatToParts(lt);
 const ld=Math.min(30,+lp.find(x=>x.type==='day').value),lm=+lp.find(x=>x.type==='month').value;
 const evHtml=e=>`<li${e[2]?' class="x"':''}><b>${fa(e[0])}</b> ${e[1]}${e[2]?' <small>(از منابع عمری‌ها)</small>':''}</li>`;
 const monthEv=EV[lm-1]||[],todayEv=monthEv.filter(e=>e[0]===ld);
 const dayRule=DAYS[ld-1],kind=dayRule[0];
 const shamsi=fm('fa-IR-u-ca-persian',{weekday:'long',day:'numeric',month:'long',year:'numeric'},r.r0);
 const qamari=fm('fa-IR-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'},lt);
 const miladi=fm('fa-IR-u-ca-gregory',{day:'numeric',month:'long',year:'numeric'},r.r0);
 const kindTxt={g:'روز سعد',b:'روز نحس',m:'روز ممزوج'}[kind];
 let html=`<section class="dates"><div class="grid"><div class="dt"><small>تاریخ شمسی</small><b>${shamsi}</b></div><div class="dt"><small>تاریخ قمری</small><b>${qamari}</b></div><div class="dt"><small>تاریخ میلادی</small><b>${miladi}</b></div></div>
 <div class="lunar ${kind}"><strong>روز ${fa(ld)} ماه قمری — ${kindTxt}</strong><br>${dayRule[1]}<div class="src">مکارم الاخلاق، فصل اختیارات ایام، از امام صادق (ع). روز کوکبی از طلوع آفتاب شروع می‌شود و تاریخ‌ها بر همین اساس است.</div></div>
 ${todayEv.length?`<div class="occ"><strong>مناسبت امروز</strong><ul>${todayEv.map(evHtml).join('')}</ul></div>`:''}
 ${monthEv.length?`<details class="mev"${mevOpen?' open':''}><summary>مناسبت‌های ${MN[lm-1]}</summary><ul>${monthEv.map(e=>evHtml(e).replace('<li','<li'+(e[0]===ld?' data-t="1"':''))).join('')}</ul></details>`:''}</section>`;

 /* روز نحس: ساعت‌ها نمایش داده نمی‌شود */
 if(kind==='b'){
  html+=`<section class="alert b"><h2>امروز کلاً نحس است</h2><p>برای همین ساعت‌ها نمایش داده نمی‌شود. بهتر است کار مهمی شروع نکنید و با احتیاط رفتار کنید.</p>${advice}${prayerBox()}</section>`;
  out.innerHTML=html;
  return;
 }
 if(kind==='m'){
  html+=`<section class="alert m"><h2>هشدار: امروز ممزوج است</h2><p>روز ممزوج یعنی سعد و نحس با هم آمیخته‌اند و گاهی از بدترین نحس هم بدتر است. با احتیاط کارهایتان را انجام دهید.</p>${advice}${prayerBox()}</section>`;
 }

 /* ساعات */
 const dl=(r.s-r.r0)/12,nl=(r.r1-r.s)/12,wi=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(wk.format(r.r0));
 const st=CH.indexOf(LORD[wi]),base=kf.format(r.r0);
 const T=x=>tf.format(x)+(kf.format(x)!==base?` <i>(${wf.format(x)})</i>`:'');
 const H=[];let cur=-1;
 for(let i=0;i<24;i++){
  const a=i<12?r.r0+i*dl:r.s+(i-12)*nl,b=i<12?r.r0+(i+1)*dl:r.s+(i-11)*nl,p=CH[(st+i)%7];
  const on=!dt.value&&ref>=a&&ref<b;if(on)cur=i;
  H.push({i,a,b,p,on,f:INFO[p]});
 }
 const chipsFor=(from,to,title,sub)=>{
  const part=H.slice(from,to),n={g:0,b:0,m:0};part.forEach(h=>n[h.f.k]++);
  return `<h3>${title}</h3><div class="cnt"><span>${sub}</span><span class="g"><i></i>سعد: ${fa(n.g)}</span><span class="b"><i></i>نحس: ${fa(n.b)}</span><span class="m"><i></i>میانه: ${fa(n.m)}</span></div><div class="chips">`+
  part.map(h=>`<button class="chip ${h.f.k}${h.on?' cur':''}" data-i="${h.i}"><small>${fa(h.i%12+1)}</small><b>${h.p}</b><span>${tf.format(h.a)} – ${tf.format(h.b)}</span><em>${h.f.t}</em></button>`).join('')+'</div>';
 };
 let now='';
 if(cur>=0){const h=H[cur],pd=Math.ceil((h.b-ref)/6e4);
  now=`<section class="now ${h.f.k}"><div class="t"><small>اکنون در ${c[0]} · ${tf.format(ref)}</small><h2>ساعت ${h.p}</h2><span class="tg">${h.f.t}</span><p>${h.f.s}</p><p><small>${h.f.n}</small></p><p><small>${fa(pd)} دقیقه تا پایان این ساعت</small></p></div>${figs(h.p)}</section>`;}
 html+=now+`<section class="sumbox">${chipsFor(0,12,'ساعات روز','طلوع '+tf.format(r.r0)+' — غروب '+tf.format(r.s))}${chipsFor(12,24,'ساعات شب','تا طلوع بعدی '+tf.format(r.r1))}</section>`;
 let rows='';
 H.forEach(h=>{
  if(h.i===0)rows+=`<div class="sun"><span>ساعات روز</span><span>طلوع ${tf.format(r.r0)} — غروب ${tf.format(r.s)}</span></div>`;
  if(h.i===12)rows+=`<div class="sun"><span>ساعات شب</span><span>طلوع بعدی ${T(r.r1)}</span></div>`;
  rows+=`<div class="row ${h.f.k}${h.on?' cur':''}" id="h${h.i}"><div class="tm">${T(h.a)} - ${T(h.b)}</div><div class="pl"><div class="hd"><b>${h.p}</b><span class="tag">${h.f.t}</span></div><div class="ds">${h.f.s}</div><div class="nt">${h.f.n}</div></div>${figs(h.p)}</div>`;
 });
 out.innerHTML=html+rows+'<p class="note">ساعات روز و شب هر کدام به ۱۲ قسمت مساوی تقسیم شده‌اند، پس طول ساعت‌ها ثابت نیست. روز کوکبی از طلوع آغاز می‌شود و اولین ساعت آن به کوکب همان روز هفته تعلق دارد. نسبت شکل‌ها به کواکب بر پایه‌ی جدول نیت‌رمل است؛ راس و ذنب جزو کواکب هفت‌گانه‌ی ساعات نیستند. تاریخ قمری بر پایه‌ی تقویم ام‌القری محاسبه می‌شود و ممکن است با رؤیت هلال در ایران یک روز تفاوت داشته باشد؛ در این صورت از منوی بالای صفحه آن را یک روز جابه‌جا کنید. زمان طلوع و غروب محاسبه‌ای است و ممکن است یکی دو دقیقه با تقویم‌های دیگر تفاوت داشته باشد.</p>';
}
out.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const el=$('h'+b.dataset.i);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});});
co.onchange=()=>{fillCities();render(1)};ci.onchange=()=>render(1);dt.onchange=()=>render(1);
lu.onchange=()=>{adj=+lu.value;try{localStorage.setItem('adj',String(adj))}catch(e){}render(0)};
$('td').onclick=()=>{dt.value='';render(1)};
render(1);setInterval(()=>{if(!dt.value)render(0)},30000);
</script>
<script id="pwa">
(function(){
 const web=/^https?:$/.test(location.protocol);
 try{
  const mk=s=>{const c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d'),k=s/512;
   x.fillStyle='#0f6e5f';x.fillRect(0,0,s,s);
   x.strokeStyle='#cfa54a';x.lineWidth=14*k;x.beginPath();x.arc(256*k,256*k,200*k,0,7);x.stroke();
   x.fillStyle='#f1d38a';
   [[1,0],[2,1],[1,2],[2,3]].forEach(([n,r])=>{const y=(148+r*72)*k;(n===1?[256]:[206,306]).forEach(cx=>{x.beginPath();x.arc(cx*k,y,24*k,0,7);x.fill();});});
   return c.toDataURL('image/png');};
  const p512=mk(512),p192=mk(192),p180=mk(180);
  document.getElementById('ati').href=p180;
  if(web){
   const m={name:'ساعات کواکب',short_name:'ساعات کواکب',lang:'fa',dir:'rtl',display:'standalone',background_color:'#0f6e5f',theme_color:'#3498db',start_url:location.href.split('#')[0],icons:[{src:p192,sizes:'192x192',type:'image/png',purpose:'any'},{src:p512,sizes:'512x512',type:'image/png',purpose:'any'}]};
   document.getElementById('mf').href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
  }
 }catch(e){}
 if(web&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 let ip=null;const ib=document.getElementById('ins');
 addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;ib.hidden=false;});
 ib.onclick=async()=>{if(!ip)return;ip.prompt();try{await ip.userChoice}catch(e){}ip=null;ib.hidden=true;};
 addEventListener('appinstalled',()=>{ib.hidden=true;});
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 const standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
 let seen=false;try{seen=localStorage.getItem('iosHint')==='1'}catch(e){}
 if(ios&&!standalone&&!seen){
  document.getElementById('ioshint').hidden=false;
  document.getElementById('iosx').onclick=()=>{document.getElementById('ioshint').hidden=true;try{localStorage.setItem('iosHint','1')}catch(e){}};
 }
})();
</script>
